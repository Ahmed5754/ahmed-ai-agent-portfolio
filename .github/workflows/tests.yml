name: Tests
on:
  push:
  pull_request:
jobs:
  pytest:
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest -q
